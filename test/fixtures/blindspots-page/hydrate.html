<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>flakeproof blindspots hydration fixture</title></head>
<body>
  <header id="site-header">
    <h1 id="header-title">Welcome to Acme</h1>
    <a id="cta" href="/contact/">Contact us</a>
  </header>
  <main id="content"><p>Body copy that nothing in the blind suite asserts on.</p></main>
  <script>
    // Ordinary client-side hydration: the framework re-renders the header
    // shortly after the static markup has already parsed, restoring the
    // text to whatever the app's own state says it should be. 50ms is
    // deliberately short - the exact window the review's reproduction used
    // - well inside blindspots' settle buffer (SETTLE_MS = 300, see
    // src/probe/mutation-script.js), so a mutation applied at
    // DOMContentLoaded is reliably overwritten before the settle check
    // reads the element again.
    setTimeout(() => {
      document.getElementById('header-title').textContent = 'Welcome to Acme';
    }, 50);
  </script>
</body>
</html>
